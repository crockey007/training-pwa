<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Training" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Training</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" href="./styles.css?v=37" />
    <style>
      html,
      body {
        background: #0b0d10;
        color: #f3f5f7;
        margin: 0;
        min-height: 100%;
      }
      #boot {
        padding: 28px 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      }
      #boot h2 {
        margin: 0;
        font-size: 24px;
      }
      #boot p {
        color: #8b95a5;
        line-height: 1.6;
        margin-top: 12px;
      }
      #boot a {
        color: #6aa6ff;
      }
      #boot a.boot-btn {
        display: block;
        margin-top: 16px;
        background: #e53935;
        color: #fff;
        text-align: center;
        text-decoration: none;
        border-radius: 14px;
        padding: 16px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="boot">
        <h2>Training</h2>
        <p>読み込み中…</p>
        <p id="repair-hint"></p>
      </main>
    </div>
    <script>
      (function () {
        var el = document.getElementById("repair-hint");
        if (el) {
          el.innerHTML = 'うまく開かないときは <a href="./v37.html">最新版に更新する</a>';
        }
      })();
      window.__bootFailed = function (msg) {
        var app = document.getElementById("app");
        if (!app) return;
        app.innerHTML =
          '<main id="boot"><h2>起動できませんでした</h2><p>' +
          (msg || "古い画面が残っている可能性があります。") +
          '</p><p><a class="boot-btn" href="./v37.html">最新版に更新する</a></p></main>';
      };
      window.addEventListener("error", function (ev) {
        if (document.getElementById("boot")) window.__bootFailed(ev.message || "読み込みエラー");
      });
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (boot) {
          var p = boot.querySelector("p");
          if (p) {
            p.innerHTML = 'まだ読み込めない場合は <a href="./v37.html">最新版に更新する</a> を開いてください。';
          }
        }
      }, 8000);
    </script>
    <script>
      (function () {
        var files = ["./data.js", "./restore-data.js", "./coach.js", "./app.js"];
        var t = Date.now();
        function next(i) {
          if (i >= files.length) return;
          var s = document.createElement("script");
          s.src = files[i] + "?t=" + t;
          s.onload = function () {
            next(i + 1);
          };
          s.onerror = function () {
            if (window.__bootFailed) window.__bootFailed("ファイルを読み込めませんでした");
          };
          document.body.appendChild(s);
        }
        next(0);
      })();
    </script>
  </body>
</html>
