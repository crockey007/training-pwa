<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>記録を入れる</title>
  <style>
    body { margin:0; background:#0b0d10; color:#f3f5f7; font-family:-apple-system,"Hiragino Sans",sans-serif; padding:28px 22px; }
    main { max-width:420px; margin:0 auto; }
    p { color:#8b95a5; line-height:1.6; }
    button { width:100%; border:0; border-radius:14px; padding:16px; background:#e53935; color:#fff; font-size:17px; font-weight:800; margin-top:16px; }
  </style>
</head>
<body>
  <main>
    <h1>8/17〜23の記録を入れる</h1>
    <p>トレ（A/B/C）とラン3回を、このiPhoneのアプリに書き込みます。今日からのメニュー提案も更新されます。</p>
    <button type="button" id="go">記録を入れてアプリを開く</button>
    <p id="msg"></p>
  </main>
  <script src="./restore-data.js?v=36"></script>
  <script>
    const KEY = "home-gym-v1";
    function mergeByDate(a, b) {
      const map = new Map();
      [...(a || []), ...(b || [])].forEach((row) => {
        const existing = map.get(row.date);
        map.set(row.date, existing ? { ...existing, ...row } : row);
      });
      return [...map.values()].sort((x, y) => x.date.localeCompare(y.date));
    }
    function restore() {
      let local = {};
      try { local = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
      const snap = typeof MAC_BACKUP !== "undefined" ? MAC_BACKUP : {};
      const byDate = new Map((local.workouts || []).map((w) => [w.date, w]));
      (snap.workouts || []).forEach((w) => byDate.set(w.date, w));
      const next = {
        workouts: [...byDate.values()].sort((x, y) => x.date.localeCompare(y.date)),
        meals: mergeByDate(local.meals, snap.meals),
        sleeps: mergeByDate(local.sleeps, snap.sleeps),
        weights: mergeByDate(local.weights, snap.weights),
        runs: mergeByDate(local.runs, snap.runs),
        scheduleOverrides: { ...(local.scheduleOverrides || {}), ...(snap.scheduleOverrides || {}) },
        draft: local.draft || null,
        profileStartDate: local.profileStartDate || snap.profileStartDate || "2026-08-17",
        updatedAt: new Date().toISOString(),
        pendingSync: false
      };
      localStorage.setItem(KEY, JSON.stringify(next));
      document.getElementById("msg").textContent = "入れました。アプリを開きます。";
      location.replace("./index.html?restored=1&t=" + Date.now());
    }
    document.getElementById("go").addEventListener("click", restore);
  </script>
</body>
</html>
