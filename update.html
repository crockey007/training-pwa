<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <title>Training 更新</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        background: #0b0d10;
        color: #f3f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 360px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        color: #8b95a5;
        line-height: 1.6;
      }
      a {
        color: #6aa6ff;
        word-break: break-all;
      }
      button {
        margin-top: 20px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 16px;
        background: #e53935;
        color: #fff;
        font-size: 17px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>最新版に更新します</h1>
      <p id="url"></p>
      <p id="msg">古いキャッシュを消して、最新の画面を読み込みます。</p>
      <button type="button" id="go">更新してアプリを開く</button>
    </main>
    <script>
      document.getElementById("url").innerHTML = '<a href="' + location.href + '">' + location.href + "</a>";
      async function refreshApp() {
        var msg = document.getElementById("msg");
        msg.textContent = "キャッシュを削除しています…";
        try {
          if (navigator.serviceWorker) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          try { localStorage.setItem("hg-app-ver", "18"); } catch (e) {}
        } catch (e) {}
        location.replace("./index.html?v=18");
      }
      document.getElementById("go").addEventListener("click", refreshApp);
      refreshApp();
    </script>
  </body>
</html>
