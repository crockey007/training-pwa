<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Training 更新</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        background: #0b0d10;
        color: #f3f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 360px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        color: #8b95a5;
        line-height: 1.6;
      }
      button,
      a.btn {
        display: block;
        box-sizing: border-box;
        margin-top: 20px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 16px;
        background: #e53935;
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
      }
      button:disabled {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>v50 に更新します</h1>
      <p>脚と体幹の種目を5つ追加します（フロントスクワット、ブルガリアン、ヒップスラスト等）。</p>
      <p id="msg">古い画面を捨てて、アプリを開き直します。</p>
      <button type="button" id="go">更新してアプリを開く</button>
    </main>
    <script>
      var running = false;
      async function refreshApp() {
        if (running) return;
        running = true;
        var btn = document.getElementById("go");
        var msg = document.getElementById("msg");
        btn.disabled = true;
        btn.textContent = "更新しています…";
        msg.textContent = "キャッシュを削除しています。このまま待ってください。";
        try {
          if (navigator.serviceWorker) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        await new Promise(function (resolve) { setTimeout(resolve, 1200); });
        var dest = new URL("./index.html", location.href);
        dest.searchParams.set("t", String(Date.now()));
        dest.searchParams.set("v", "50");
        location.replace(dest.href);
      }
      document.getElementById("go").addEventListener("click", refreshApp);
    </script>
  </body>
</html>
